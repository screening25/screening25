<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>솔로체크 관리자</title><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"></head>
<body><main>
  <p class="sub">솔로체크 관리자</p><h1 id="org">불러오는 중</h1>
  <p class="sub" id="chain"></p>

  <h2>지금 작업 중</h2><div id="sessions"></div>

  <h2>작업자</h2>
  <div class="card">
    <table id="workers"></table>
    <div class="row" style="margin-top:12px"><input class="grow" id="wname" maxlength="40" placeholder="이름" style="width:auto"><button id="addw">작업자 추가</button></div>
    <p class="sub">링크를 작업자에게 보내면 그 휴대폰이 작업자 화면이 됩니다.<br>설치할 앱은 없습니다.</p>
  </div>

  <h2>월간 기록</h2>
  <div class="card">
    <div class="row"><input type="month" id="month" style="width:auto"><button id="loadReport">보기</button><a class="btn" id="csv">CSV 받기</a></div>
    <div id="report"></div>
  </div>

  <h2>알림 받기</h2>
  <div class="card"><p class="sub" id="pushNote">무응답·긴급 호출이 이 기기로 옵니다.</p><button id="push">알림 켜기</button></div>

  <h2 id="tlTitle" hidden>작업 기록</h2><div id="timeline"></div>
</main>
<script type="module">
import { $, api, token, STATUS, hm, esc, beep, enablePush } from '/common.js';
const TYPE_KO = { started: '작업 시작', checkin: '안부', reminded: '확인 요청', escalated: '무응답 보고', sos: '긴급 호출', sos_sent: '긴급 전달', ack: '관리자 확인', ended: '작업 끝' };
const loud = new Set(['missed', 'sos']);
let seen = new Set();

async function load() {
  const d = await api(`/api/m/${token}`);
  $('#org').textContent = d.org.name;
  $('#chain').textContent = d.chain.ok ? '기록 사슬 검증 통과 · 지워지거나 고쳐진 기록 없음' : `기록 사슬이 ${d.chain.brokenAt}번째 줄에서 어긋납니다`;
  const order = { sos: 0, missed: 1, sos_ack: 2, missed_ack: 3, due: 4, ok: 5 };
  d.sessions.sort((a, b) => order[a.status] - order[b.status]);
  $('#sessions').innerHTML = d.sessions.length ? d.sessions.map((s) => `
    <div class="card ${loud.has(s.status) ? 'alert' : ''}">
      <div class="row"><strong class="grow">${esc(s.worker)}</strong><span class="badge s-${s.status}">${STATUS[s.status]}</span></div>
      <p class="sub">${esc(s.place)} · ${s.intervalMin}분마다 · 마지막 안부 ${hm(s.lastOk)}${s.overdueMin ? ` · 기한 ${s.overdueMin}분 지남` : ''}</p>
      <div class="row">${loud.has(s.status) ? `<button class="danger" data-ack="${s.id}">대응 시작 기록</button>` : ''}<button data-tl="${s.id}">기록 보기</button></div>
    </div>`).join('') : '<p class="sub">작업 중인 사람이 없습니다.</p>';
  const fresh = d.sessions.filter((s) => loud.has(s.status) && !seen.has(s.id + s.status));
  if (fresh.length) beep(5);
  seen = new Set(d.sessions.map((s) => s.id + s.status));
  $('#workers').innerHTML = d.workers.map((w) => `<tr><td>${esc(w.name)}</td><td class="mono">${location.origin}${w.url}</td><td><button data-copy="${location.origin}${w.url}">링크 복사</button></td></tr>`).join('');
}

document.addEventListener('click', async (e) => {
  const t = e.target;
  try {
    if (t.dataset.ack) { const by = prompt('누가 대응하나요?', '관리자'); if (by === null) return; await api(`/api/m/${token}/ack`, { sessionId: t.dataset.ack, by }); await load(); }
    if (t.dataset.tl) showTimeline(t.dataset.tl);
    if (t.dataset.copy) { await navigator.clipboard.writeText(t.dataset.copy); t.textContent = '복사함'; }
  } catch (err) { alert(err.message); }
});

async function showTimeline(id) {
  const d = await api(`/api/m/${token}/timeline/${id}`);
  $('#tlTitle').hidden = false;
  $('#timeline').innerHTML = `<div class="card"><strong>${esc(d.session.worker)} · ${esc(d.session.place)}</strong><table>${d.events.map((e) =>
    `<tr><td>${hm(e.at)}</td><td>${TYPE_KO[e.type] ?? e.type}</td><td class="sub">${e.data.by ? esc(e.data.by) : e.data.delivered !== undefined ? `기기 ${e.data.delivered}대` : ''}</td><td class="mono">${e.hash.slice(0, 12)}</td></tr>`).join('')}</table></div>`;
  $('#tlTitle').scrollIntoView({ behavior: 'smooth' });
}

$('#addw').onclick = async () => { try { await api(`/api/m/${token}/workers`, { name: $('#wname').value }); $('#wname').value = ''; await load(); } catch (e) { alert(e.message); } };
const month = $('#month'); month.value = new Date().toISOString().slice(0, 7);
const syncCsv = () => { $('#csv').href = `/api/m/${token}/report?month=${month.value}&format=csv`; };
month.onchange = syncCsv; syncCsv();
$('#loadReport').onclick = async () => {
  const r = await api(`/api/m/${token}/report?month=${month.value}`);
  const s = r.summary;
  $('#report').innerHTML = `<table>
    <tr><td>작업 건수</td><td>${s.sessions}</td></tr><tr><td>작업 시간</td><td>${Math.round(s.workMinutes / 6) / 10}시간</td></tr>
    <tr><td>안부 응답</td><td>${s.checkins}회</td></tr><tr><td>무응답 보고</td><td>${s.missed}회</td></tr>
    <tr><td>긴급 호출</td><td>${s.sos}회</td></tr><tr><td>가장 늦은 대응</td><td>${s.maxResponseMin ?? '없음'}${s.maxResponseMin !== null ? '분' : ''}</td></tr></table>`;
};
$('#push').onclick = async () => { try { await enablePush(`/api/m/${token}/push`); $('#pushNote').textContent = '알림을 켰습니다.'; } catch (e) { alert(e.message); } };

load().catch(() => { $('#org').textContent = '링크가 맞지 않습니다'; });
setInterval(() => load().catch(() => {}), 10000);
</script></body></html>
