<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>솔로체크 작업자</title><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"></head>
<body><main>
  <p class="sub" id="org"></p><h1 id="who">불러오는 중</h1>

  <section id="idle" hidden>
    <div class="card">
      <label for="place">어디서 작업하나요</label><input id="place" maxlength="80" placeholder="예: B2 기계실">
      <label for="interval">안부를 몇 분마다 보낼까요</label>
      <select id="interval"><option>15</option><option selected>30</option><option>45</option><option>60</option><option>90</option><option>120</option></select>
      <p class="sub">정한 시간에 확인 요청이 옵니다.<br>5분 안에 안부를 보내지 않으면 관리자에게 알림이 갑니다.</p>
      <button class="primary big" id="start">작업 시작</button>
    </div>
  </section>

  <section id="working" hidden>
    <div class="card" id="statusCard">
      <div class="row"><span class="badge" id="badge"></span><span class="sub grow" id="place2"></span></div>
      <div class="clock" id="clock">--:--</div>
      <p class="sub" id="dueText"></p>
      <button class="primary big" id="checkin">안부 보내기</button>
    </div>
    <div class="card">
      <button class="danger big hold" id="sos"><span class="fill"></span>긴급 호출 (2초 누르기)</button>
    </div>
    <button id="end">작업 끝내기</button>
  </section>

  <h2>알림 받기</h2>
  <div class="card"><p class="sub" id="pushNote">화면이 꺼져 있어도 확인 요청을 받으려면 알림을 켜 주세요.<br>안드로이드 크롬에서 가장 잘 동작합니다.<br>아이폰은 공유 버튼으로 홈 화면에 추가한 뒤 켤 수 있습니다.</p>
    <button id="push">알림 켜기</button></div>
</main>
<script type="module">
import { $, api, token, STATUS, hm, beep, enablePush } from '/common.js';
let state, lastStatus;

async function load() {
  state = await api(`/api/w/${token}`);
  $('#org').textContent = state.org; $('#who').textContent = state.name;
  const s = state.session;
  $('#idle').hidden = !!s; $('#working').hidden = !s;
  if (s) {
    $('#badge').textContent = STATUS[s.status]; $('#badge').className = `badge s-${s.status}`;
    $('#place2').textContent = `${s.place} · ${s.intervalMin}분마다`;
    $('#statusCard').classList.toggle('alert', s.status !== 'ok');
    if (s.status !== 'ok' && s.status !== lastStatus) beep();
    lastStatus = s.status;
  }
  render();
}
function render() {
  const s = state?.session; if (!s) return;
  const left = s.dueAt - Date.now();
  const m = Math.floor(Math.abs(left) / 60000), sec = Math.floor(Math.abs(left) / 1000) % 60;
  $('#clock').textContent = `${left < 0 ? '+' : ''}${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  $('#dueText').textContent = left >= 0 ? `다음 확인 ${hm(s.dueAt)}` : `확인 시간이 ${hm(s.dueAt)}에 지났습니다`;
}
const act = (fn) => async () => { try { await fn(); await load(); } catch (e) { alert(e.message); } };
$('#start').onclick = act(() => api(`/api/w/${token}/start`, { place: $('#place').value, intervalMin: $('#interval').value }));
$('#checkin').onclick = act(() => api(`/api/w/${token}/checkin`, {}));
$('#end').onclick = act(async () => { if (confirm('작업을 끝낼까요? 끝내면 확인 요청이 멈춥니다.')) await api(`/api/w/${token}/ended`, {}); });
$('#push').onclick = async () => { try { await enablePush(`/api/w/${token}/push`); $('#pushNote').textContent = '알림을 켰습니다.'; } catch (e) { alert(e.message); } };

// 긴급 호출은 실수로 눌리지 않게 2초를 누르고 있어야 한다.
let holdTimer; const fill = $('#sos .fill');
const down = (e) => { e.preventDefault(); fill.style.transition = 'width 2s linear'; fill.style.width = '100%';
  holdTimer = setTimeout(act(() => api(`/api/w/${token}/sos`, {})), 2000); };
const up = () => { clearTimeout(holdTimer); fill.style.transition = 'none'; fill.style.width = '0'; };
$('#sos').addEventListener('pointerdown', down); ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => $('#sos').addEventListener(ev, up));

load().catch((e) => { $('#who').textContent = '링크가 맞지 않습니다'; });
setInterval(() => load().catch(() => {}), 10000); setInterval(render, 1000);
</script></body></html>
